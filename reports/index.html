
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Test Results</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f8f9fa;
            color: #212529;
        }

        .stat-card {
            border: 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .table th {
            white-space: nowrap;
            font-size: 0.85rem;
            color: #6c757d;
        }

        .table td {
            vertical-align: middle;
            font-size: 0.9rem;
        }

        .test-name {
            font-weight: 500;
            overflow-wrap: anywhere;
        }

        .message {
            max-width: 300px;
            overflow-wrap: anywhere;
        }

        .endpoint {
            font-family: monospace;
        }

        .details-toggle {
            cursor: pointer;
        }

        .detail-row td {
            background: #fff;
            border-top: none;
        }

        .detail-block {
            font-family: monospace;
            font-size: 0.8rem;
            background: #f1f3f5;
            border-radius: 6px;
            padding: 0.6rem 0.8rem;
            max-height: 220px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 0.5rem;
        }

        .call-block {
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .call-block:last-child {
            margin-bottom: 0;
        }

        .call-title {
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .detail-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #6c757d;
            margin-bottom: 0.2rem;
        }
    </style>
</head>

<body>
<div class="container-fluid px-4 py-4">

    <!-- Header -->
    <div class="d-flex flex-wrap justify-content-between
                align-items-center gap-3 mb-4">
        <div>
            <h3 class="mb-1">API Test Results</h3>
            <div class="text-secondary small" id="run-info">
                Loading test report...
            </div>
        </div>

        <button class="btn btn-outline-secondary btn-sm"
                onclick="loadResults()">
            Refresh
        </button>
    </div>

    <!-- Summary cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <div class="stat-label">Total tests</div>
                    <div class="stat-value" id="total">0</div>
                </div>
            </div>
        </div>

        <div class="col-6 col-md">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <div class="stat-label">Passed</div>
                    <div class="stat-value text-success" id="passed">0</div>
                </div>
            </div>
        </div>

        <div class="col-6 col-md">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <div class="stat-label">Failed</div>
                    <div class="stat-value text-danger" id="failed">0</div>
                </div>
            </div>
        </div>

        <div class="col-6 col-md">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <div class="stat-label">Skipped</div>
                    <div class="stat-value text-warning" id="skipped">0</div>
                </div>
            </div>
        </div>

        <div class="col-6 col-md">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <div class="stat-label">Errors</div>
                    <div class="stat-value text-secondary" id="errors">0</div>
                </div>
            </div>
        </div>

        <div class="col-6 col-md">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <div class="stat-label">Not executed</div>
                    <div class="stat-value text-secondary" id="not-executed">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Results table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between
                        align-items-center gap-3 mb-3">
                <h5 class="mb-0">Test details</h5>

                <div class="d-flex flex-wrap gap-2">
                    <select id="outcome-filter"
                            class="form-select form-select-sm"
                            style="width: 140px"
                            aria-label="Filter by outcome"
                            onchange="renderTable()">
                        <option value="all">All outcomes</option>
                        <option value="passed">Passed</option>
                        <option value="failed">Failed</option>
                        <option value="skipped">Skipped</option>
                        <option value="error">Errors</option>
                        <option value="not_executed">Not executed</option>
                    </select>

                    <input id="search"
                           type="search"
                           class="form-control form-control-sm"
                           placeholder="Search tests..."
                           aria-label="Search tests"
                           style="width: 200px"
                           oninput="renderTable()">
                </div>
            </div>

            <div id="error-alert" class="alert alert-danger d-none"
                 role="alert"></div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Outcome</th>
                        <th>Duration (s)</th>
                        <th>Message</th>
                        <th>Endpoint</th>
                        <th>Details</th>
                    </tr>
                    </thead>
                    <tbody id="results-body">
                    <tr>
                        <td colspan="6"
                            class="text-center text-secondary py-4">
                            Loading results...
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between
                        align-items-center mt-3">
                <small class="text-secondary" id="result-count"></small>
                <small class="text-secondary" id="run-duration"></small>
            </div>
        </div>
    </div>
</div>

<script>
    let tests = [];

    const escapeHtml = (value) =>
        String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);

    function getOutcome(test) {
        const outcome = String(test.outcome || '').toLowerCase();

        if (outcome === 'passed') return 'passed';
        if (outcome === 'failed') return 'failed';
        if (outcome === 'skipped') return 'skipped';
        if (outcome === 'error' || outcome === 'errors') return 'error';

        return outcome || 'unknown';
    }

    function getBadge(outcome) {
        const styles = {
            passed: 'success',
            failed: 'danger',
            skipped: 'warning',
            error: 'secondary',
            not_executed: 'dark'
        };

        const color = styles[outcome] || 'light text-dark';

        return `<span class="badge bg-${color}">${escapeHtml(outcome)}</span>`;
    }

    function normalizeReport(report) {
        // Accepte les deux formats : le résultat brut d'exécution
        // ({totals: {passed,failed,errors,skipped}}) et le rapport détaillé
        // joint produit par reporting/report_builder.py
        // ({summary: {passed,failed,error,skipped,not_executed,total}}).
        const totals = report.summary || report.totals || {};
        return {
            tests: Array.isArray(report.tests) ? report.tests : [],
            totals: {
                passed: totals.passed ?? 0,
                failed: totals.failed ?? 0,
                error: totals.error ?? totals.errors ?? 0,
                skipped: totals.skipped ?? 0,
                not_executed: totals.not_executed ?? 0,
            },
            date: report.date || null,
            duration_s: report.duration_s || 0,
        };
    }

    async function loadResults() {
        const alert = document.getElementById('error-alert');
        alert.classList.add('d-none');

        try {
            // Un export autonome (report.html) embarque ses données directement
            // dans la page : pas de fetch nécessaire, et ça fonctionne sans
            // serveur (ouverture directe du fichier dans un navigateur).
            const raw = window.__EMBEDDED_REPORT__ || await (async () => {
                const response = await fetch('./results.json', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Could not load test-results.json (HTTP ${response.status}).`);
                }
                return response.json();
            })();

            if (!Array.isArray(raw.tests)) {
                throw new Error('Invalid report: "tests" must be an array.');
            }

            const report = normalizeReport(raw);
            tests = report.tests;

            const count = outcome => tests.filter(test => getOutcome(test) === outcome).length;

            document.getElementById('total').textContent = tests.length;
            document.getElementById('passed').textContent = report.totals.passed ?? count('passed');
            document.getElementById('failed').textContent = report.totals.failed ?? count('failed');
            document.getElementById('skipped').textContent = report.totals.skipped ?? count('skipped');
            document.getElementById('errors').textContent = report.totals.error ?? count('error');
            document.getElementById('not-executed').textContent =
                report.totals.not_executed ?? count('not_executed');

            document.getElementById('run-info').textContent =
                report.date
                    ? `Run date: ${new Date(report.date).toLocaleString()}`
                    : 'Test execution report';

            document.getElementById('run-duration').textContent =
                `Total duration: ${Number(report.duration_s || 0).toFixed(2)} s`;

            renderTable();
        } catch (error) {
            alert.textContent = error.message;
            alert.classList.remove('d-none');

            document.getElementById('results-body').innerHTML = `
                <tr>
                    <td colspan="6"
                        class="text-center text-secondary py-4">
                        Unable to load test results.
                    </td>
                </tr>`;
        }
    }

    function renderTable() {
        const filter = document.getElementById('outcome-filter').value;
        const search = document.getElementById('search').value
            .trim().toLowerCase();

        const filtered = tests.filter(test => {
            const outcome = getOutcome(test);

            const matchesOutcome =
                filter === 'all' || outcome === filter;

            const text = [
                test.name,
                test.outcome,
                test.message,
                test.endpoint,
                test.description
            ].map(value => value ?? '').join(' ').toLowerCase();

            return matchesOutcome && text.includes(search);
        });

        const body = document.getElementById('results-body');

        if (filtered.length === 0) {
            body.innerHTML = `
                <tr>
                    <td colspan="6"
                        class="text-center text-secondary py-4">
                        No matching tests found.
                    </td>
                </tr>`;
        } else {
            body.innerHTML = filtered.map((test, index) => {
                const outcome = getOutcome(test);
                const detailId = `details-${index}`;
                const calls = Array.isArray(test.requests) ? test.requests : [];
                const checks = Array.isArray(test.assertions) ? test.assertions : [];
                const hasDetails = calls.length > 0 || checks.length > 0 || !!test.description;

                const toggleCell = hasDetails
                    ? `<button type="button" class="btn btn-sm btn-outline-secondary details-toggle"
                               onclick="toggleDetails('${detailId}')">
                           ${calls.length > 0 ? `View (${calls.length})` : 'Details'}
                       </button>`
                    : '<span class="text-secondary small">-</span>';

                const detailRow = hasDetails ? `
                    <tr id="${detailId}" class="detail-row d-none">
                        <td colspan="6">${renderScenarioDetails(test, calls, checks)}</td>
                    </tr>` : '';

                return `
                    <tr>
                        <td class="test-name text-capitalize">
                            ${
                                escapeHtml(test.name ?? '-')
                                .replace('test_get', 'test get ')
                                .replace('test_put', 'test put ')
                                .replace('test_post', 'test post ')
                                .replace('test_patch', 'test patch ')
                                .split('_').join(' ')
                            }
                        </td>
                        <td>${getBadge(outcome)}</td>
                        <td>${Number(test.duration_s || 0).toFixed(3)}</td>
                        <td class="message">
                            ${escapeHtml(test.message ?? '-')}
                        </td>
                        <td class="endpoint">
                            ${escapeHtml(test.endpoint ?? '-')}
                        </td>
                        <td>${toggleCell}</td>
                    </tr>${detailRow}`;
            }).join('');
        }

        document.getElementById('result-count').textContent =
            `Showing ${filtered.length} of ${tests.length} tests`;
    }

    function prettyValue(value) {
        if (value === null || value === undefined || value === '') return '-';
        if (typeof value === 'string') return value;
        try {
            return JSON.stringify(value, null, 2);
        } catch (error) {
            return String(value);
        }
    }

    function renderScenarioDetails(test, calls, checks) {
        const lastStatus = calls.length > 0 ? calls[calls.length - 1].status : null;
        const parts = [];

        if (test.description) {
            parts.push(`
                <div class="detail-label">Objectif du scénario</div>
                <div class="mb-3">${escapeHtml(test.description)}</div>
            `);
        }

        if (Array.isArray(test.expected_status)) {
            parts.push(`
                <div class="detail-label">Statut HTTP attendu vs obtenu</div>
                <div class="mb-3">
                    attendu ${escapeHtml(prettyValue(test.expected_status))}
                    &rarr; obtenu ${escapeHtml(prettyValue(lastStatus))}
                </div>
            `);
        }

        parts.push(renderAssertions(checks));
        parts.push(renderCalls(calls));

        return parts.join('');
    }

    function renderAssertions(checks) {
        if (!Array.isArray(checks) || checks.length === 0) {
            return '<div class="text-secondary small mb-3">Aucune assertion détaillée journalisée pour ce test.</div>';
        }

        const rows = checks.map(check => {
            const passed = !!check.passed;
            const icon = passed ? '✓' : '✗';
            const cls = passed ? 'text-success' : 'text-danger';
            return `
                <div class="${cls}">
                    ${icon} ${escapeHtml(check.check ?? '?')} :
                    attendu ${escapeHtml(prettyValue(check.expected))},
                    obtenu ${escapeHtml(prettyValue(check.actual))}
                </div>`;
        }).join('');

        return `<div class="detail-label">Assertions (${checks.length})</div><div class="mb-3">${rows}</div>`;
    }

    function renderCalls(calls) {
        return calls.map((call, index) => `
            <div class="call-block">
                <div class="call-title">
                    #${index + 1} ${escapeHtml(call.method ?? '?')} ${escapeHtml(call.path ?? '')}
                    &rarr; ${escapeHtml(call.status ?? 'no response')}
                </div>
                <div class="detail-label">Request headers (secrets redacted)</div>
                <div class="detail-block">${escapeHtml(prettyValue(call.request_headers))}</div>
                <div class="detail-label">Request body</div>
                <div class="detail-block">${escapeHtml(prettyValue(call.request_body))}</div>
                <div class="detail-label">Response body</div>
                <div class="detail-block">${escapeHtml(prettyValue(call.response_body))}</div>
            </div>
        `).join('');
    }

    function toggleDetails(id) {
        const row = document.getElementById(id);
        if (row) {
            row.classList.toggle('d-none');
        }
    }

    loadResults();
</script>
</body>
</html>
